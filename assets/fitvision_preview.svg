<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="auto" role="img" aria-label="FitVision AI Real-time Pose Estimation &amp; Workout Tracking">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09121d"/>
      <stop offset="100%" stop-color="#0f2231"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="240" rx="12" fill="url(#bgGrad3)" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <circle cx="28" cy="24" r="5" fill="#f87171"/>
  <circle cx="44" cy="24" r="5" fill="#fbbf24"/>
  <circle cx="60" cy="24" r="5" fill="#34d399"/>
  <text x="82" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">COMPUTER VISION • REAL-TIME POSE ANALYSIS</text>
  
  <!-- Pose Skeleton Graphic -->
  <g transform="translate(48, 50)">
    <!-- Head -->
    <circle cx="50" cy="25" r="12" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <!-- Spine -->
    <line x1="50" y1="37" x2="50" y2="85" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Shoulders -->
    <line x1="20" y1="50" x2="80" y2="50" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="20" y1="50" x2="10" y2="80" stroke="#06b6d4" stroke-width="2"/>
    <line x1="10" y1="80" x2="20" y2="110" stroke="#06b6d4" stroke-width="2"/>
    <line x1="80" y1="50" x2="90" y2="80" stroke="#06b6d4" stroke-width="2"/>
    <line x1="90" y1="80" x2="80" y2="110" stroke="#06b6d4" stroke-width="2"/>
    <!-- Hips -->
    <line x1="30" y1="85" x2="70" y2="85" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Legs (Squat Position) -->
    <line x1="30" y1="85" x2="15" y2="120" stroke="#10b981" stroke-width="2.5"/>
    <line x1="15" y1="120" x2="35" y2="150" stroke="#10b981" stroke-width="2.5"/>
    <line x1="70" y1="85" x2="85" y2="120" stroke="#10b981" stroke-width="2.5"/>
    <line x1="85" y1="120" x2="65" y2="150" stroke="#10b981" stroke-width="2.5"/>
    <!-- Keypoint Nodes -->
    <circle cx="50" cy="25" r="4" fill="#34d399"/>
    <circle cx="20" cy="50" r="3.5" fill="#38bdf8"/>
    <circle cx="80" cy="50" r="3.5" fill="#38bdf8"/>
    <circle cx="10" cy="80" r="3.5" fill="#06b6d4"/>
    <circle cx="90" cy="80" r="3.5" fill="#06b6d4"/>
    <circle cx="30" cy="85" r="3.5" fill="#38bdf8"/>
    <circle cx="70" cy="85" r="3.5" fill="#38bdf8"/>
    <circle cx="15" cy="120" r="4" fill="#10b981"/>
    <circle cx="85" cy="120" r="4" fill="#10b981"/>
    <circle cx="35" cy="150" r="3.5" fill="#10b981"/>
    <circle cx="65" cy="150" r="3.5" fill="#10b981"/>
  </g>

  <!-- Metrics & Feedback Info -->
  <rect x="180" y="58" width="180" height="68" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="194" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">EXERCISE / REPETITIONS</text>
  <text x="194" y="104" fill="#34d399" font-family="monospace" font-size="18" font-weight="700">12 REPS (VALID)</text>
  <text x="194" y="118" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Cadence: 2.4s / rep</text>

  <rect x="374" y="58" width="202" height="68" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="388" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">JOINT ANGLE &amp; FORM CHECK</text>
  <text x="388" y="104" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="700">92° KNEE FLEXION</text>
  <text x="388" y="118" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">✓ Good Depth • Spine Neutral</text>

  <!-- Badges -->
  <rect x="180" y="140" width="396" height="42" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="194" y="160" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MediaPipe 33-Keypoint Pose Tracking • Edge Inference (30+ FPS)</text>
  <text x="194" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Real-time biomechanical analysis and automated form correction feedback</text>

  <!-- Footer Tag -->
  <text x="24" y="222" fill="#64748b" font-family="monospace" font-size="9">Computer Vision • OpenCV • MediaPipe • Python &amp; WebGL</text>
</svg>